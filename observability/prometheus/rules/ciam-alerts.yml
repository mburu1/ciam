groups:
  - name: ciam-api
    rules:
      - alert: CiamApiUnavailable
        expr: up{job="ciam-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: ciam-api
        annotations:
          summary: CIAM API is unavailable
          description: Prometheus cannot scrape the CIAM API health endpoint.

      - alert: CiamApiHighErrorRate
        expr: |
          (
            sum(rate(http_server_request_duration_count{http_response_status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_request_duration_count[5m])), 1)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: ciam-api
        annotations:
          summary: CIAM API server error rate is high
          description: More than 5 percent of API requests returned 5xx responses for five minutes.

      - alert: CiamApiHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_server_request_duration_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: ciam-api
        annotations:
          summary: CIAM API p95 latency is high
          description: The API p95 request duration has exceeded one second for ten minutes.
